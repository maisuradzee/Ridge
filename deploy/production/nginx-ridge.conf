# RIDGE API edge: install under /etc/nginx/conf.d/ridge-api.conf.
# Replace ridge-api.example.com in server_name and certificate paths before deployment.

upstream ridge_api_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

# Per-source-IP defaults. Tune after observing real login and shard traffic.
limit_req_zone $binary_remote_addr zone=ridge_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ridge_gateway:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=ridge_control:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ridge_internal:10m rate=300r/s;

# Log only the path. Never log request lines, query strings or credentials.
log_format ridge_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ridge-api.example.com;
    # Do not process credentials or request bodies over plaintext HTTP.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ridge-api.example.com;

    if ($host != ridge-api.example.com) {
        return 444;
    }

    ssl_certificate     /etc/letsencrypt/live/ridge-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ridge-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RIDGE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/ridge-api.access.log ridge_safe;
    error_log  /var/log/nginx/ridge-api.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite untrusted client forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    location = /ready {
        return 404;
    }

    location = /health {
        limit_req zone=ridge_general burst=500 nodelay;
        proxy_pass http://ridge_api_backend;
    }

    location = /v1/gateway/session {
        limit_except POST {
            deny all;
        }
        limit_req zone=ridge_general burst=500 nodelay;
        limit_req zone=ridge_gateway burst=500 nodelay;
        proxy_pass http://ridge_api_backend;
    }

    location ^~ /v1/control/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow fc00::/7;
        deny all;

        limit_req zone=ridge_general burst=500 nodelay;
        limit_req zone=ridge_control burst=100 nodelay;
        proxy_pass http://ridge_api_backend;
    }

    location ^~ /v1/internal/ {
        limit_req zone=ridge_general burst=500 nodelay;
        limit_req zone=ridge_internal burst=500 nodelay;
        proxy_pass http://ridge_api_backend;
    }

    location / {
        limit_req zone=ridge_general burst=500 nodelay;
        proxy_pass http://ridge_api_backend;
    }
}
